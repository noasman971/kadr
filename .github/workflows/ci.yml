# Continuous integration: every push and pull request must keep the workspace
# formatted, lint-free, documented and passing its tests on Windows, Linux and macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Any warning (compiler, clippy or rustdoc) fails the build.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Shared FFmpeg builds (headers + libraries) used on Windows and Linux.
  FFMPEG_BUILDS_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Build, lint, test and docs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # --- FFmpeg 9 development files, one way per system ---
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "$env:FFMPEG_BUILDS_URL/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $ffmpegDirectory = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$ffmpegDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$ffmpegDirectory\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # No GPU on the runner: render with WARP, Windows' software adapter, and
          # make the GPU tests fail instead of skipping if it does not work.
          "KADR_GPU_ADAPTER=software" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KADR_REQUIRE_GPU=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --silent --show-error "$FFMPEG_BUILDS_URL/ffmpeg-n9.0-latest-linux64-gpl-shared-9.0.tar.xz" --output "$RUNNER_TEMP/ffmpeg.tar.xz"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar --extract --file "$RUNNER_TEMP/ffmpeg.tar.xz" --directory "$RUNNER_TEMP/ffmpeg" --strip-components 1
          echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          # No GPU on the runner: render with lavapipe, Mesa's software Vulkan,
          # and make the GPU tests fail instead of skipping if it does not work.
          sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
          echo "KADR_GPU_ADAPTER=software" >> "$GITHUB_ENV"
          echo "KADR_REQUIRE_GPU=1" >> "$GITHUB_ENV"
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        # GPU tests run on Metal when the runner exposes it, and are skipped otherwise.
        run: brew install pkgconf ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  # The engine crates must build for Android phones (see docs/android.md). This job is
  # not a required check of `main` while the Android port is in progress; making it
  # one is the owner's decision (CLAUDE.md, "main is protected").
  android:
    name: Android build (aarch64-linux-android)
    runs-on: ubuntu-latest
    env:
      # Oldest Android version Kadr supports: API 28, Android 9 (decision record 0041).
      ANDROID_API_LEVEL: 28
      # The crates the Android app will use. FFmpeg is left out (`--no-default-features`).
      ANDROID_CRATES: -p kadr-core -p kadr-vision -p kadr-render -p kadr-engine
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      # The runner image ships the Android NDK; cargo-ndk finds it through ANDROID_NDK_HOME.
      - name: Use the runner's latest Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build for Android
        run: cargo ndk --target arm64-v8a --platform "$ANDROID_API_LEVEL" build $ANDROID_CRATES --no-default-features --lib
      - name: Lint for Android
        run: cargo ndk --target arm64-v8a --platform "$ANDROID_API_LEVEL" clippy $ANDROID_CRATES --no-default-features --lib -- -D warnings
      # Linking the test programs checks that every system library the code needs
      # exists on Android. The engine's own tests use FFmpeg and stay on desktop.
      - name: Link the test programs for Android
        run: cargo ndk --target arm64-v8a --platform "$ANDROID_API_LEVEL" test --no-run -p kadr-core -p kadr-vision -p kadr-render

  test-fixtures:
    name: Test video fixtures can be generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Generate fixtures
        shell: pwsh
        run: ./scripts/generate-test-fixtures.ps1
