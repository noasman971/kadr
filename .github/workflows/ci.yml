# Continuous integration: every push and pull request must keep the workspace
# formatted, lint-free, documented and passing its tests on Windows, Linux and macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Any warning (compiler, clippy or rustdoc) fails the build.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Shared FFmpeg builds (headers + libraries) used on Windows and Linux.
  FFMPEG_BUILDS_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Build, lint, test and docs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # --- FFmpeg 9 development files, one way per system ---
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "$env:FFMPEG_BUILDS_URL/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $ffmpegDirectory = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$ffmpegDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$ffmpegDirectory\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --silent --show-error "$FFMPEG_BUILDS_URL/ffmpeg-n9.0-latest-linux64-gpl-shared-9.0.tar.xz" --output "$RUNNER_TEMP/ffmpeg.tar.xz"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar --extract --file "$RUNNER_TEMP/ffmpeg.tar.xz" --directory "$RUNNER_TEMP/ffmpeg" --strip-components 1
          echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg/lib" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  test-fixtures:
    name: Test video fixtures can be generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Generate fixtures
        shell: pwsh
        run: ./scripts/generate-test-fixtures.ps1
