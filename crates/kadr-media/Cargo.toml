[package]
name = "kadr-media"
description = "Kadr media input and output: probing, decoding and encoding video and audio."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# The FFmpeg backend, used on Windows, macOS and Linux. The Android build will
# disable it and use a MediaCodec backend behind the same traits (phase 9).
default = ["ffmpeg"]
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
ffmpeg-next = { workspace = true, optional = true }
image.workspace = true
kadr-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
