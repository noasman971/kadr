[package]
name = "kadr-media"
description = "Kadr media input and output: probing, decoding and encoding video and audio."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# The FFmpeg backend, used on Windows, macOS and Linux.
default = ["ffmpeg"]
ffmpeg = ["dep:ffmpeg-next"]
# The MediaCodec backend, used on Android (decision 0042). The NDK crates only exist
# when building for Android; on the development machine, the feature compiles the
# backend's arithmetic for its tests. Pictures are decoded by `image`'s pure-Rust
# PNG, JPEG and WebP decoders.
mediacodec = ["dep:ndk", "dep:ndk-sys", "image/png", "image/jpeg", "image/webp"]

[dependencies]
ffmpeg-next = { workspace = true, optional = true }
image.workspace = true
kadr-core.workspace = true
rayon.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ndk = { workspace = true, optional = true }
ndk-sys = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

# These write and read real files with FFmpeg.
[[test]]
name = "ffmpeg_round_trip"
required-features = ["ffmpeg"]

[[example]]
name = "write_test_video"
required-features = ["ffmpeg"]

[lints]
workspace = true
