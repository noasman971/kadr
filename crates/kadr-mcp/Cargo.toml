[package]
name = "kadr-mcp"
description = "Kadr local MCP server: lets Claude Desktop and Claude Code edit videos with a regular Claude subscription."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "kadr-mcp"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
kadr-app-link.workspace = true
kadr-engine.workspace = true
kadr-tools.workspace = true
rmcp.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# A fake app on its own pipe, for the relay test.
kadr-app-link = { workspace = true, features = ["server"] }
image = { workspace = true, features = ["jpeg"] }
kadr-core.workspace = true
kadr-media = { workspace = true, features = ["ffmpeg"] }
# Synthetic scenes with a known true position, for the blur tests.
kadr-vision.workspace = true
# The tests talk to the server as Claude would: through an MCP client.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
