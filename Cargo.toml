# Kadr — free and open source video editor, driven by Claude through MCP.
#
# This is the Cargo workspace root. Every crate lives in `crates/` and shares the
# package metadata, the dependency versions and the lint rules declared below.
# See `docs/architecture.md` for the role of each crate.

[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/noasman971/kadr"
authors = ["Kadr contributors"]
publish = false

# Shared dependency versions. A dependency is added here (internal crates by path,
# external crates with an exact version) only when a crate starts using it:
# Cargo warns about declared but unused dependencies, and warnings fail the CI.
# The planned dependencies between Kadr crates are described in docs/architecture.md.
[workspace.dependencies]
kadr-core = { path = "crates/kadr-core" }
# FFmpeg is opt-in, so crates that only need the picture types stay portable.
kadr-media = { path = "crates/kadr-media", default-features = false }
kadr-render = { path = "crates/kadr-render" }
kadr-engine = { path = "crates/kadr-engine" }

clap = { version = "4.6.10", features = ["derive"] }
ctrlc = "3.5.3"
# Desktop app (apps/desktop/src-tauri): Tauri 2 and the official plugins it uses.
tauri = { version = "2.12.7", features = [] }
tauri-build = { version = "2.7.6", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
# Text layout and rasterisation; no fontconfig, so Linux needs no extra system library.
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
# FFmpeg 7 or newer (see README.md, "FFmpeg development files").
ffmpeg-next = "9.1.0"
# Only the pixel buffer types and basic operations: no image file codecs.
image = { version = "0.25.10", default-features = false }
pollster = "1.0.3"
rayon = "1.12.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
wgpu = "30.0.2"

# Test-only dependencies.
criterion = "0.8.2"
insta = "1.49.0"
tempfile = "3.27.0"

[workspace.lints.rust]
# Every public item must be documented: someone new to the project should
# understand the API from `cargo doc` alone.
missing_docs = "warn"
# `unsafe` is forbidden by default. A crate that truly needs FFI must opt out
# explicitly in its own Cargo.toml and justify every `unsafe` block in a comment.
unsafe_code = "deny"

[workspace.lints.clippy]
# Library code must report errors instead of panicking.
# `clippy.toml` still allows `unwrap`/`expect` inside tests.
unwrap_used = "warn"
expect_used = "warn"
# Leftovers that must never reach `main`.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev.package.kadr-vision]
# Tracking tests follow synthetic objects over hundreds of frames: optimise the
# vision code even in debug builds so that `cargo test` stays quick.
opt-level = 2

[profile.dev.package.rustfft]
opt-level = 3

[profile.release]
# Video processing is CPU heavy: optimise across crates in release builds.
lto = "thin"
codegen-units = 1

# Build scripts and procedural macros are compiled with optimisations. Without them,
# `bindgen` (which generates the FFmpeg bindings in `ffmpeg-sys-next`'s build script)
# overflows the 1 MB main-thread stack Windows gives build scripts, since the desktop
# app's procedural macros enable more of `syn`. Optimised, it also runs faster.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
