[package]
name = "kadr-desktop"
description = "Kadr desktop app: the Tauri 2 back end that runs the engine for the Svelte front end."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
# Tauri's build script needs its own section; the executable is called `kadr`.
default-run = "kadr"

[lib]
# The library holds everything; `main.rs` only starts it. The mobile build
# (phase 9) needs the app as a library.
name = "kadr_desktop"
crate-type = ["rlib"]

[[bin]]
name = "kadr"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
kadr-app-link = { workspace = true, features = ["server"] }
kadr-core.workspace = true
kadr-engine.workspace = true
kadr-media = { workspace = true, features = ["ffmpeg"] }
kadr-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
